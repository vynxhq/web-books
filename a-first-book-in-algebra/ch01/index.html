<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algebraic Notation — A First Book in Algebra</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render"><!-- hold the first frame until the player exists, so the page transition can run -->
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 1, title: 'Algebraic Notation', minutes: 6, language: 'en' };   // set next once the next chapter exists

/* ---------- chapter drawing helpers ---------- */
const mline = (p, parts, x, y, t0, fill = COL.chalk, size = 48, anchor = 'middle') => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };
// A quantity bar: the recurring picture for "times as many" (see BOOK.md). Label may be '' for an unnamed bar.
const qtyBar = (p, x, y, w, label, color) => {
  const g = G(p, { x, y, o: 0 });
  mk('rect', { x: 0, y: -34, width: w, height: 68, rx: 10, fill: mix(COL.board, color, .4), stroke: color, 'stroke-width': 2.5 }, g);
  const lab = label ? M(g, [label], { x: w / 2, y: 13, size: 40, fill: COL.chalk }) : null;
  return { g, lab };
};

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Algebraic Notation', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Chapter 1', { x: 800, y: 320, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Algebraic Notation', { x: 800, y: 430, size: 88, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'How algebra writes numbers — and turns sentences into equations.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],
  ['letters', 'A letter holds a number', (m) => {
    const p = panel(0);
    const expr = mline(p, 'x + 4', 620, 430, .25, COL.chalk, 88);
    const c1 = chip(p, ['12'], COL.whole, { x: 1150, y: 280, size: 40, o: 0, s: .6 });
    const c2 = chip(p, ['0.5'], COL.whole, { x: 1265, y: 445, size: 40, o: 0, s: .6 });
    const c3 = chip(p, [F(2, 3)], COL.whole, { x: 1150, y: 610, size: 40, o: 0, s: .6 });
    pop(c1, m('any')); pop(c2, m('any') + .25); pop(c3, m('any') + .5);
    text(p, 'x can be any of these', 1195, 730, m('any') + .9, { size: 30, fill: COL.dim, anchor: 'middle' });
    pulse(expr, m('holds'), 1.25);
    text(p, 'it holds the number\'s place', 620, 560, m('holds') + .5, { size: 32, fill: COL.task, anchor: 'middle', weight: 600 });
  }],
  ['coeff', 'The coefficient', (m) => {
    const p = panel(0);
    let row = tokens(p, ['x', '+', 'x', '+', 'x'], { x: 800, y: 380, size: 64, anchor: 'middle' });
    row.forEach((e, i) => { put(e, { o: 0 }); show(e, .2 + i * .08, .4); });
    pulse(row[0], m('row')); pulse(row[4], m('row') + .2);
    row = collapse(row, 0, 4, ['3x'], m('threex'), { color: COL.task });
    text(p, 'the coefficient counts the copies', 800, 545, m('coefficient'), { size: 34, fill: COL.task, anchor: 'middle', weight: 600 });
    draw(path(p, 'M760 455Q800 490 840 455', { stroke: COL.task, 'stroke-width': 3 }, { d: 0 }), m('coefficient') + .2, .5);
  }],
  ['q1', 'Quick check', () => {
    const p = panel(0);
    const row = tokens(p, ['x', '+', 'x', '+', 'x', '+', 'x', '+', 'x'], { x: 800, y: 380, size: 44, anchor: 'middle' });
    row.forEach((e, i) => { put(e, { o: 0 }); show(e, .2 + i * .05, .4); });
  }, { ask: done => quiz(BAND, [{
    id: 'c-coeff',
    prompt: ['Which matches five copies of x, added?'],
    build: choice([['5 + x'], [$m('x', E(5))], ['5x']], 2,
      'The coefficient counts the copies: 5x.',
      ['That adds 5 and x — not five copies of x.', 'A power multiplies five factors; these are added.', null]),
  }], done) }],
  ['powers', 'The power', (m) => {
    const p = panel(0);
    let row = tokens(p, ['x', '·', 'x', '·', 'x'], { x: 800, y: 330, size: 64, anchor: 'middle' });
    row.forEach((e, i) => { put(e, { o: 0 }); show(e, .2 + i * .07, .4); });
    pulse(row[0], m('multiplied'));
    row = collapse(row, 0, 4, ['x', E(3)], m('third'), { color: COL.nat });
    text(p, 'the power counts the factors', 800, 490, m('power'), { size: 34, fill: COL.nat, anchor: 'middle', weight: 600 });
    const a = mline(p, '3x', 560, 680, m('power') + 1.4, COL.whole, 54);
    const at = text(p, 'copies added', 560, 735, m('power') + 1.4, { size: 26, fill: COL.dim, anchor: 'middle' });
    const b = mline(p, ['x', E(3)], 1040, 680, m('power') + 1.9, COL.nat, 54);
    const bt = text(p, 'factors multiplied', 1040, 735, m('power') + 1.9, { size: 26, fill: COL.dim, anchor: 'middle' });
  }],
  ['q2', 'Quick check', () => {
    const p = panel(0);
    mline(p, ['x', E(3)], 800, 400, .25, COL.chalk, 96);
  }, { ask: done => quiz(BAND, [{
    id: 'c-power',
    prompt: ['What does ', $m('x', E(3)), ' mean?'],
    build: choice([[$m('x · x · x')], [$m('x + x + x')], [$m('3 · x')]], 0,
      'Three factors of x, multiplied.',
      [null, 'That is 3x — copies added, not factors multiplied.', 'That is 3x again — a coefficient, not a power.']),
  }], done) }],
  ['method', 'Let x be the number', (m) => {
    const p = panel(0);
    text(p, 'The sum of two numbers is 60; the greater is four times the less.', 800, 120, .3, { size: 30, fill: COL.dim, anchor: 'middle' });
    const b1 = qtyBar(p, 170, 280, 110, 'x', COL.task);
    const b2 = qtyBar(p, 304, 280, 440, '4x', COL.nat);
    tw(b1.g, { o: 1 }, m('bars'), .5);
    tw(b2.g, { o: 1 }, m('bars') + .3, .5);
    text(p, 'the less', 225, 350, m('let'), { size: 28, fill: COL.dim, anchor: 'middle' });
    text(p, 'the greater', 524, 350, m('let') + .2, { size: 28, fill: COL.dim, anchor: 'middle' });
    bracketH(p, 170, 744, 400, 'sum = 60', COL.whole, m('sum'));
    eqLine(p, '4x + x', '60', 240, m('sum') + .8, { xEq: 1150 });
    eqLine(p, '5x', '60', 330, m('combine'), { xEq: 1150, note: 'combined', noteX: 1330 });
    eqLine(p, 'x', '12', 420, m('less'), { xEq: 1150, fill: COL.task });
    eqLine(p, '4x', '48', 510, m('greater'), { xEq: 1150, fill: COL.nat });
    hide(b1.lab, m('less'), .3);
    mline(p, '12', 225, 293, m('less') + .3, COL.good, 42);
    hide(b2.lab, m('greater'), .3);
    mline(p, '48', 524, 293, m('greater') + .3, COL.good, 42);
    text(p, 'Every word problem becomes a sentence in x.', 800, 640, m('greater') + 2, { size: 32, fill: COL.dim, anchor: 'middle' });
  }],
  ['q3', 'Quick check', () => {
    const p = panel(0);
    const b1 = qtyBar(p, 560, 300, 110, '', COL.task);
    const b2 = qtyBar(p, 694, 300, 220, '', COL.nat);
    tw(b1.g, { o: 1 }, .3, .5); tw(b2.g, { o: 1 }, .55, .5);
    bracketH(p, 560, 914, 380, 'sum = 129', COL.whole, .9);
  }, { ask: done => quiz(BAND, [{
    id: 'c-eq',
    prompt: ['Which equation fits?'],
    build: choice([[$m('2x − x = 129')], [$m('x + 2x = 129')], [$m('x + 2 = 129')]], 1,
      'Less x plus greater 2x — together 129.',
      ['That is a difference; the picture shows a sum.', null, 'Twice the less is 2x, not 2.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [['A letter stands for a number waiting to be found.', 'w1'],
     ['A coefficient counts copies added; a power counts factors multiplied.', 'w2'],
     ['Let x be the number, then write the sentence as an equation.', 'w3']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 280 + i * 150, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 33, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
    text(p, 'Now try the chapter practice.', 800, 820, m('end'), { size: 30, fill: COL.dim, anchor: 'middle' });
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [
    { id: 'p-horse-eq',
      prompt: ['Let x be the horse\'s cost, in dollars. The whole purchase came to $500. Write the total as an equation.'],
      build: blanks([{ parts: ['x + 3x = ', { box: '500' }],
        why: 'The carriage is three times the horse (3x), and together they cost $500: 4x = 500.',
        hint: 'The carriage cost three times x, so together: x + 3x.' }]) },
    { id: 'p-horse-cost',
      prompt: ['What did the horse cost?'],
      build: blanks([{ parts: ['The horse cost $', { box: '125' }],
        why: '4x = 500, so x = 125 — and the carriage was 3x = $375. Check: 125 + 375 = 500.',
        hint: 'Divide 500 by 4.' }]) },
  ], done, 'Chapter practice') }],
  ['final2', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [
    { id: 'p-farm-diff',
      prompt: ['Let x be the smaller farm, in acres. One is six times the other, and they differ by 250 acres. Write the difference as an equation.'],
      build: blanks([{ parts: ['6x − x = ', { box: '250' }],
        why: 'Six copies of x minus one copy is 5x — and the difference is 250 acres.',
        hint: 'Six copies of x minus one copy leaves five copies.' }]) },
    { id: 'p-farm-size',
      prompt: ['How big is the smaller farm?'],
      build: blanks([{ parts: ['x = ', { box: '50' }, ' acres'],
        why: '5x = 250, so x = 50. The larger farm is 6x = 300 — check: 300 − 50 = 250.',
        hint: 'Divide 250 by 5.' }]) },
  ], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
